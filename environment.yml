name: gcn-bot
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core dependencies
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  
  # Astronomy packages
  - astropy>=5.3.0
  - astroplan>=0.9.0
  - pytz>=2023.3
  
  # Kafka for GCN streaming
  - pip
  - pip:
    - gcn-kafka>=0.3.0
  
  # Slack integration
  - pip:
    - slack-sdk>=3.23.0
    - slack-bolt>=1.18.0
  
  # Additional utilities
  - pip:
    - python-dotenv>=1.0.0

# Optional: Development tools (uncomment if needed)
#  - pytest>=7.4.0
#  - black>=23.0.0
#  - flake8>=6.0.0